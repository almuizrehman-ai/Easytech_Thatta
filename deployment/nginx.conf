# ============================================================
# EASYTECH THATTA — Nginx Configuration
# ============================================================
# Save to: /etc/nginx/sites-available/easystech
# Enable: ln -s /etc/nginx/sites-available/easystech /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
# ============================================================

# ---------- Upstream Gunicorn ----------
upstream easystech_app {
    server unix:/run/gunicorn/easystech.sock fail_timeout=0;
}

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name easystech.pk www.easystech.pk;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS server ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easystech.pk www.easystech.pk;

    # ---------- SSL ----------
    ssl_certificate     /etc/letsencrypt/live/easystech.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easystech.pk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/easystech.pk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- Security headers ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Logging ----------
    access_log /var/log/nginx/easystech_access.log;
    error_log  /var/log/nginx/easystech_error.log warn;

    # ---------- Client limits ----------
    client_max_body_size 5M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss;

    # ---------- Static files (Django collectstatic) ----------
    location /static/ {
        alias /var/www/easystech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- Media files (user uploads) ----------
    location /media/ {
        alias /var/www/easystech/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;

        # Optional: deny script execution
        location ~* \.(php|py|sh|cgi)$ {
            deny all;
        }
    }

    # ---------- Health check ----------
    location = /healthz/ {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- Django app ----------
    location / {
        proxy_pass http://easystech_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}