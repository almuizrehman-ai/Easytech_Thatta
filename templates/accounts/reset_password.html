{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — EASYTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo"><i class="bi bi-key-fill"></i></div>
            <h1 class="brand-title">Set New Password</h1>
            <p class="brand-subtitle">Apna naya password set karein</p>
        </div>

        {% if form.non_field_errors %}
            <div class="alert alert-danger small">{{ form.non_field_errors.0 }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">New Password</label>
                {{ form.new_password }}
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                {{ form.confirm_password }}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Save New Password</button>
        </form>
    </div>
</div>
</body>
</html>
