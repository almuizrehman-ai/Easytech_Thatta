{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — EASYTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="brand-title">Forgot Password</h1>
            <p class="brand-subtitle">Apna Username aur Mobile number enter karein</p>
        </div>

        {% if form.non_field_errors %}
            <div class="alert alert-danger small">{{ form.non_field_errors.0 }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label">Registered Mobile Number</label>
                {{ form.mobile }}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Verify & Continue</button>
            <div class="text-center mt-3">
                <a href="{% url 'accounts:login' %}" class="text-decoration-none small">Back to Login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
